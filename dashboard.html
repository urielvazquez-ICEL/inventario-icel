<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - ICEL La Villa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <!-- LIBRERÍA OFICIAL DE GOOGLE -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        .tabla-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .tabla-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .tabla-scroll::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 4px; }
        .tabla-scroll::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }
        #ssoOverlay { backdrop-filter: blur(8px); }
    </style>
</head>
<body class="text-gray-800 min-h-screen p-6">

    <!-- PANTALLA DE BLOQUEO OFICIAL CON GOOGLE -->
    <div id="ssoOverlay" class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border-t-4 border-[#1a237e]">
            <div class="w-16 h-16 bg-[#1a237e] rounded-full flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg">
                <i class="fab fa-google"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-1">Universidad ICEL</h2>
            <p class="text-sm text-gray-500 mb-6">Inicia sesión para continuar al Dashboard</p>
            
            <!-- ========================================== -->
            <!-- AQUÍ VA TU ID DE CLIENTE DE GOOGLE CLOUD   -->
            <!-- ========================================== -->
            <div id="g_id_onload"
                 data-client_id="AQUI_PEGA_TU_ID_DE_CLIENTE.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="validarLoginGoogle"
                 data-auto_prompt="false">
            </div>
            
            <div class="g_id_signin flex justify-center"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL DASHBOARD (INICIA OCULTO) -->
    <div id="mainApp" class="max-w-6xl mx-auto hidden">
        
        <!-- HEADER ADMIN -->
        <header class="flex justify-between items-center mb-8 bg-[#1a237e] p-6 rounded-2xl shadow-lg border border-indigo-900 text-white">
            <div class="flex items-center gap-4">
                <!-- Se mostrará tu foto de perfil de Google -->
                <img id="perfilGoogle" src="" alt="Perfil" class="w-12 h-12 rounded-full border-2 border-white shadow-inner hidden">
                <div id="iconoAdmin" class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center text-2xl shadow-inner">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">Panel de Control IT</h1>
                    <p class="text-sm text-indigo-200 mt-0.5" id="saludoUsuario">Acceso Exclusivo: Administración de Sistemas ICEL</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="cargarDatos()" class="bg-[#00c853] text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-[#00a844] transition-colors flex items-center gap-2 shadow-md">
                    <i class="fas fa-sync-alt" id="iconoSync"></i> Actualizar BD
                </button>
                <button onclick="location.reload()" class="bg-red-500 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-red-600 transition-colors flex items-center gap-2 shadow-md">
                    <i class="fas fa-power-off"></i> Salir
                </button>
            </div>
        </header>

        <!-- TARJETAS DE ESTADÍSTICAS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition-shadow">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Registros (Filas)</p>
                    <h2 class="text-5xl font-black text-[#1a237e]" id="countRegistros">0</h2>
                </div>
                <div class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 text-3xl"><i class="fas fa-list"></i></div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition-shadow">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Total de Piezas</p>
                    <h2 class="text-5xl font-black text-green-500" id="countPiezas">0</h2>
                </div>
                <div class="w-16 h-16 rounded-full bg-green-50 flex items-center justify-center text-green-500 text-3xl"><i class="fas fa-boxes"></i></div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition-shadow">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">En Bodega</p>
                    <h2 class="text-5xl font-black text-orange-500" id="countBodega">0</h2>
                </div>
                <div class="w-16 h-16 rounded-full bg-orange-50 flex items-center justify-center text-orange-500 text-3xl"><i class="fas fa-door-closed"></i></div>
            </div>
        </div>

        <!-- SECCIÓN DE AUDITORÍA -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
            
            <div class="p-5 border-b border-gray-100 bg-gray-50 flex flex-col md:flex-row justify-between items-center gap-4">
                <h3 class="font-bold text-gray-700 text-lg flex items-center gap-2">
                    <i class="fas fa-database text-indigo-500"></i> Auditoría de Inventario
                </h3>
                
                <div class="flex w-full md:w-auto gap-3">
                    <div class="relative w-full md:w-72">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="buscadorTabla" onkeyup="filtrarTabla()" placeholder="Buscar etiqueta, modelo, ubicación..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                    </div>
                    <button onclick="exportarCSV()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-700 transition-colors flex items-center gap-2 whitespace-nowrap">
                        <i class="fas fa-file-download"></i> <span class="hidden sm:inline">Exportar</span>
                    </button>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="overflow-x-auto tabla-scroll max-h-[500px]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-white sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">Inventario ID</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b text-center">Piezas</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b w-1/2">Descripción</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">Ubicación</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b text-center">Foto</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla" class="divide-y divide-gray-100">
                        <!-- Aquí se insertan los datos -->
                    </tbody>
                </table>
            </div>
            
            <div class="p-3 bg-gray-50 border-t border-gray-100 text-xs text-gray-500 text-right" id="infoResultados">
                Mostrando 0 registros
            </div>

        </div>
    </div>

    <script>
        const URL_API = 'https://script.google.com/macros/s/AKfycbxQjrBeul4jnDA1s-gMAhQaAMhisZX52SE8gXJljWV7rjOCBIGScs5xnah7oMxAly5mpg/exec';
        let datosGlobales = []; 

        // ¿Para qué funciona?: Desencripta el token de seguridad que Google te manda tras un login exitoso.
        function decodificarJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // ¿Para qué funciona?: Se ejecuta automáticamente cuando te logueas. Valida que seas tú y te da acceso al Dashboard.
        function validarLoginGoogle(response) {
            const datosUsuario = decodificarJwtResponse(response.credential);
            
            // ==========================================
            // EL CANDADO: SOLO TÚ PUEDES ENTRAR
            // ==========================================
            const correoAutorizado = "urielvazquez@icel.edu.mx"; 
            
            if (datosUsuario.email !== correoAutorizado) {
                alert("Acceso denegado. Esta cuenta no tiene permisos de administrador del sistema.");
                return;
            }

            // Si es correcto, ocultamos la pantalla de login y mostramos tu dashboard
            document.getElementById('ssoOverlay').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            // Ponemos tu foto y tu nombre en el encabezado superior
            document.getElementById('saludoUsuario').innerText = `Sesión activa: ${datosUsuario.email}`;
            document.getElementById('perfilGoogle').src = datosUsuario.picture;
            document.getElementById('perfilGoogle').classList.remove('hidden');
            document.getElementById('iconoAdmin').classList.add('hidden');

            // Comenzamos a descargar la base de datos automáticamente
            cargarDatos();
        }

        function cargarDatos() {
            document.getElementById('iconoSync').classList.add('fa-spin');
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center text-gray-400 font-medium"><i class="fas fa-circle-notch fa-spin text-2xl mb-2 text-indigo-500"></i><br>Conectando con Google Sheets...</td></tr>`;
            
            const payload = { accion: 'leerEquipos' };
            const script = document.createElement('script');
            const callbackName = 'callback_dashboard_' + Date.now();
            
            window[callbackName] = function(res) {
                delete window[callbackName]; 
                document.body.removeChild(script);
                document.getElementById('iconoSync').classList.remove('fa-spin');
                
                if (res.success) {
                    datosGlobales = res.data; 
                    
                    let piezas = 0;
                    let bodega = 0;

                    res.data.forEach(eq => {
                        let cantidad = parseInt(eq.piezas) || 1;
                        piezas += cantidad;
                        let ubicacion = (eq.ubicacion || '').toLowerCase();
                        if (ubicacion.includes('bodega') || ubicacion.includes('almacen')) bodega += cantidad;
                    });

                    document.getElementById('countRegistros').innerText = res.data.length;
                    document.getElementById('countPiezas').innerText = piezas;
                    document.getElementById('countBodega').innerText = bodega;

                    renderTabla(datosGlobales);
                } else {
                    alert('Error al leer BD: ' + res.message);
                }
            };
            
            script.src = URL_API + '?callback=' + callbackName + '&data=' + encodeURIComponent(JSON.stringify(payload));
            document.body.appendChild(script);
        }

        function renderTabla(datos) {
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = ''; 
            
            if(datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No hay registros que coincidan.</td></tr>`;
                document.getElementById('infoResultados').innerText = `Mostrando 0 registros`;
                return;
            }

            datos.forEach(eq => {
                let botonFoto = eq.foto ? 
                    `<a href="${eq.foto}" target="_blank" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded-full inline-flex"><i class="fas fa-image"></i></a>` : 
                    `<span class="text-gray-300">-</span>`;

                let fila = `
                    <tr class="hover:bg-indigo-50/50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-700">${eq.inventario}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 text-center font-medium">${eq.piezas}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${eq.descripcion}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">
                                ${eq.ubicacion}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">${botonFoto}</td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
            
            document.getElementById('infoResultados').innerText = `Mostrando ${datos.length} registros`;
        }

        function filtrarTabla() {
            const textoBuscado = document.getElementById('buscadorTabla').value.toLowerCase();
            
            const datosFiltrados = datosGlobales.filter(eq => {
                return eq.inventario.toLowerCase().includes(textoBuscado) ||
                       eq.descripcion.toLowerCase().includes(textoBuscado) ||
                       eq.ubicacion.toLowerCase().includes(textoBuscado);
            });
            
            renderTabla(datosFiltrados);
        }

        function exportarCSV() {
            if(datosGlobales.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }
            
            let csvContent = "data:text/csv;charset=utf-8,INVENTARIO,PIEZAS,DESCRIPCION,UBICACION,FOTO\n";
            
            datosGlobales.forEach(function(eq) {
                let descLimpia = eq.descripcion.replace(/,/g, " "); 
                let fila = `${eq.inventario},${eq.piezas},${descLimpia},${eq.ubicacion},${eq.foto}`;
                csvContent += fila + "\n";
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Reporte_Inventario_ICEL.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Ya NO usamos window.onload = cargarDatos; porque ahora la carga inicia SOLO cuando el login es válido.
    </script>
</body>
</html>
