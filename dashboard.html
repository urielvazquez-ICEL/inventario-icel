<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - ICEL La Villa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        .tabla-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .tabla-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .tabla-scroll::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 4px; }
        .tabla-scroll::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }
        #ssoOverlay, #modalEdicion { backdrop-filter: blur(8px); }
    </style>
</head>
<body class="text-gray-800 min-h-screen p-2 sm:p-6">

    <div id="ssoOverlay" class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border-t-4 border-[#1a237e]">
            <div class="w-16 h-16 bg-[#1a237e] rounded-full flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg">
                <i class="fab fa-google"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-1">Universidad ICEL</h2>
            <p class="text-sm text-gray-500 mb-6">Inicia sesión para continuar al Dashboard</p>
            
            <div id="g_id_onload"
                 data-client_id="41940845604-c5ag9q0mqhbla0ubhu40akok5euklh33.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="validarLoginGoogle"
                 data-auto_prompt="false">
            </div>
            
            <div class="g_id_signin flex justify-center overflow-hidden" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
        </div>
    </div>

    <div id="mainApp" class="max-w-7xl mx-auto hidden">
        
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 sm:mb-8 bg-[#1a237e] p-4 sm:p-6 rounded-2xl shadow-lg border border-indigo-900 text-white text-center md:text-left">
            <div class="flex flex-col md:flex-row items-center gap-3 md:gap-4">
                <img id="perfilGoogle" src="" alt="Perfil" class="w-12 h-12 rounded-full border-2 border-white shadow-inner hidden">
                <div id="iconoAdmin" class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center text-2xl shadow-inner">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Panel de Control IT</h1>
                    <p class="text-xs sm:text-sm text-indigo-200 mt-0.5" id="saludoUsuario">Acceso Exclusivo: Administración de Sistemas</p>
                </div>
            </div>
            <div class="flex gap-2 sm:gap-3 w-full md:w-auto justify-center mt-2 md:mt-0">
                <button onclick="cargarDatos()" class="flex-1 md:flex-none justify-center bg-[#00c853] text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-[#00a844] transition-colors flex items-center gap-2 shadow-md">
                    <i class="fas fa-sync-alt" id="iconoSync"></i> <span class="hidden sm:inline">Actualizar</span>
                </button>
                <button onclick="location.reload()" class="flex-1 md:flex-none justify-center bg-red-500 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-red-600 transition-colors flex items-center gap-2 shadow-md">
                    <i class="fas fa-power-off"></i> Salir
                </button>
            </div>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6 mb-6 sm:mb-8">
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center justify-between hover:shadow-md transition-shadow text-center sm:text-left gap-2 sm:gap-0">
                <div>
                    <p class="text-[10px] sm:text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Registros</p>
                    <h2 class="text-3xl sm:text-4xl font-black text-[#1a237e]" id="countRegistros">0</h2>
                </div>
                <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 text-xl sm:text-2xl"><i class="fas fa-list"></i></div>
            </div>

            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center justify-between hover:shadow-md transition-shadow text-center sm:text-left gap-2 sm:gap-0">
                <div>
                    <p class="text-[10px] sm:text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Total Piezas</p>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-500" id="countPiezas">0</h2>
                </div>
                <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-green-50 flex items-center justify-center text-green-500 text-xl sm:text-2xl"><i class="fas fa-desktop"></i></div>
            </div>

            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center justify-between hover:shadow-md transition-shadow text-center sm:text-left gap-2 sm:gap-0">
                <div>
                    <p class="text-[10px] sm:text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">En Bodega</p>
                    <h2 class="text-3xl sm:text-4xl font-black text-orange-500" id="countBodega">0</h2>
                </div>
                <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-orange-50 flex items-center justify-center text-orange-500 text-xl sm:text-2xl"><i class="fas fa-door-closed"></i></div>
            </div>

            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-red-100 flex flex-col sm:flex-row items-center justify-between hover:shadow-md transition-shadow bg-red-50/30 text-center sm:text-left gap-2 sm:gap-0">
                <div>
                    <p class="text-[10px] sm:text-xs font-bold text-red-400 uppercase tracking-wider mb-1">Faltan Datos</p>
                    <h2 class="text-3xl sm:text-4xl font-black text-red-600" id="countIncompletos">0</h2>
                </div>
                <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-xl sm:text-2xl"><i class="fas fa-exclamation-triangle"></i></div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
            <div class="p-4 sm:p-5 border-b border-gray-100 bg-gray-50 flex flex-col lg:flex-row justify-between items-center gap-4">
                <h3 class="font-bold text-gray-700 text-lg flex items-center gap-2 whitespace-nowrap self-start lg:self-auto">
                    <i class="fas fa-database text-indigo-500"></i> Auditoría
                </h3>
                
                <div class="flex flex-col sm:flex-row w-full lg:w-auto gap-3 items-center justify-end">
                    <select id="filtroEdificio" onchange="filtrarTabla()" class="w-full sm:w-auto px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 focus:outline-none focus:border-indigo-500 bg-white cursor-pointer">
                        <option value="">Todos los Edificios</option>
                        <option value="Edificio A">Edificio A</option>
                        <option value="Edificio B">Edificio B</option>
                        <option value="Edificio C">Edificio C</option>
                        <option value="Edificio D">Edificio D</option>
                        <option value="Bodega">Bodega</option>
                    </select>

                    <div class="relative w-full sm:w-64">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="buscadorTabla" onkeyup="filtrarTabla()" placeholder="Buscar etiqueta, modelo..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 transition-all">
                    </div>
                    
                    <!-- ACTUALIZACIÓN: Botón directo a Google Sheets -->
                    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1UWIFzJgOYdUR27WOX8nO-tLvSbcSsr0Da44-p4X99xM/edit?hl=es&gid=0#gid=0', '_blank')" class="w-full sm:w-auto justify-center bg-[#0f9d58] text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#0b8043] transition-colors flex items-center gap-2">
                        <i class="fas fa-file-excel"></i> <span class="hidden sm:inline">Ver en Sheets</span>
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto tabla-scroll max-h-[500px]">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead class="bg-white sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="px-4 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">ID</th>
                            <th class="px-4 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b text-center">Piezas</th>
                            <th class="px-4 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b w-1/3">Descripción</th>
                            <th class="px-4 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">Ubicación</th>
                            <th class="px-4 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">Responsable</th>
                            <th class="px-4 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b text-center">Foto</th>
                            <th class="px-4 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla" class="divide-y divide-gray-100">
                    </tbody>
                </table>
            </div>
            
            <div class="p-3 bg-gray-50 border-t border-gray-100 text-xs text-gray-500 text-right" id="infoResultados">
                Mostrando 0 registros
            </div>
        </div>
    </div>

    <div id="modalEdicion" class="fixed inset-0 bg-gray-900/80 z-[60] flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
            <div class="bg-[#1a237e] px-4 sm:px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base sm:text-lg"><i class="fas fa-edit mr-2"></i> Editar Registro</h3>
                <button onclick="cerrarModal()" class="text-indigo-200 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-4 sm:p-6 space-y-4">
                <input type="hidden" id="editIdOriginal">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Descripción</label>
                    <textarea id="editDescripcion" rows="3" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Piezas</label>
                        <input type="number" id="editPiezas" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Ubicación</label>
                        <input type="text" id="editUbicacion" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 px-4 sm:px-6 py-4 border-t flex justify-end gap-3">
                <button onclick="cerrarModal()" class="px-4 py-2 text-gray-600 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-semibold transition-colors w-full sm:w-auto">Cancelar</button>
                <button onclick="guardarEdicion()" class="px-4 py-2 text-white bg-[#00c853] hover:bg-[#00a844] rounded-lg text-sm font-semibold transition-colors flex items-center justify-center gap-2 w-full sm:w-auto">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </div>
    </div>

    <script>
        const URL_API = 'https://script.google.com/macros/s/AKfycby1iTpUpD9pF8McowQdF-TrmJ0Gs2Koh3XOL9yQR0jqcQThQyeekG6SqPfiGOL_qcnO8g/exec';
        let datosGlobales = []; 

        function decodificarJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function validarLoginGoogle(response) {
            const datosUsuario = decodificarJwtResponse(response.credential);
            const correoAutorizado = "urielvazquez@icel.edu.mx"; 
            
            if (datosUsuario.email !== correoAutorizado) {
                alert("Acceso denegado. Esta cuenta no tiene permisos de administrador del sistema.");
                return;
            }

            document.getElementById('ssoOverlay').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            document.getElementById('saludoUsuario').innerText = `Sesión activa: ${datosUsuario.email}`;
            document.getElementById('perfilGoogle').src = datosUsuario.picture;
            document.getElementById('perfilGoogle').classList.remove('hidden');
            document.getElementById('iconoAdmin').classList.add('hidden');

            cargarDatos();
        }

        function cargarDatos() {
            document.getElementById('iconoSync').classList.add('fa-spin');
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-10 text-center text-gray-400 font-medium"><i class="fas fa-circle-notch fa-spin text-2xl mb-2 text-indigo-500"></i><br>Conectando con BD...</td></tr>`;
            
            const payload = { accion: 'leerEquipos' };
            const script = document.createElement('script');
            const callbackName = 'callback_dashboard_' + Date.now();
            
            window[callbackName] = function(res) {
                delete window[callbackName]; 
                document.body.removeChild(script);
                document.getElementById('iconoSync').classList.remove('fa-spin');
                
                if (res.success) {
                    datosGlobales = res.data; 
                    
                    let piezas = 0;
                    let bodega = 0;
                    let incompletos = 0;

                    res.data.forEach(eq => {
                        let cantidad = parseInt(eq.piezas) || 1;
                        piezas += cantidad;
                        
                        let ubicacion = (eq.ubicacion || '').toLowerCase();
                        if (ubicacion.includes('bodega') || ubicacion.includes('almacen')) bodega += cantidad;

                        let desc = (eq.descripcion || '').toUpperCase();
                        if (!eq.foto || !desc.includes('S/N')) incompletos++;
                    });

                    document.getElementById('countRegistros').innerText = res.data.length;
                    document.getElementById('countPiezas').innerText = piezas;
                    document.getElementById('countBodega').innerText = bodega;
                    document.getElementById('countIncompletos').innerText = incompletos;

                    renderTabla(datosGlobales);
                } else {
                    alert('Error al leer BD: ' + res.message);
                }
            };
            
            script.src = URL_API + '?callback=' + callbackName + '&data=' + encodeURIComponent(JSON.stringify(payload));
            document.body.appendChild(script);
        }

        function renderTabla(datos) {
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = ''; 
            
            if(datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">No hay registros que coincidan.</td></tr>`;
                document.getElementById('infoResultados').innerText = `Mostrando 0 registros`;
                return;
            }

            datos.forEach(eq => {
                // ACTUALIZACIÓN: Aquí sacamos el link puro de Google Drive si viene con la fórmula
                let urlFoto = eq.foto || "";
                if (urlFoto.includes("=IMAGE")) {
                    let coincidencia = urlFoto.match(/"([^"]+)"/);
                    if (coincidencia) {
                        urlFoto = coincidencia[1];
                    }
                }

                let botonFoto = urlFoto ? 
                    `<a href="${urlFoto}" target="_blank" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded-full inline-flex"><i class="fas fa-image"></i></a>` : 
                    `<span class="text-red-300" title="Sin foto"><i class="fas fa-times-circle"></i></span>`;

                let responsable = eq.usuario || eq.correo || "<span class='text-gray-400 italic'>No registrado</span>";

                let fila = `
                    <tr class="hover:bg-indigo-50/50 transition-colors group">
                        <td class="px-4 py-3 whitespace-nowrap text-sm font-bold text-gray-700">${eq.inventario}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-600 text-center font-medium">${eq.piezas}</td>
                        <td class="px-4 py-3 text-sm text-gray-600 whitespace-pre-wrap">${eq.descripcion}</td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">
                                ${eq.ubicacion}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-xs text-gray-500 font-medium whitespace-nowrap">
                            <i class="fas fa-user text-gray-300 mr-1"></i> ${responsable}
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-center">${botonFoto}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-center">
                            <div class="flex gap-2 justify-center opacity-100 md:opacity-50 group-hover:opacity-100 transition-opacity">
                                <button onclick="abrirModalEditar('${eq.inventario}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded-lg" title="Editar"><i class="fas fa-edit"></i></button>
                                <button onclick="eliminarRegistro('${eq.inventario}')" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded-lg" title="Eliminar"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
            
            document.getElementById('infoResultados').innerText = `Mostrando ${datos.length} registros`;
        }

        function filtrarTabla() {
            const textoBuscado = document.getElementById('buscadorTabla').value.toLowerCase();
            const filtroEdificio = document.getElementById('filtroEdificio').value.toLowerCase();
            
            const datosFiltrados = datosGlobales.filter(eq => {
                const coincideTexto = eq.inventario.toLowerCase().includes(textoBuscado) ||
                                      eq.descripcion.toLowerCase().includes(textoBuscado) ||
                                      (eq.usuario && eq.usuario.toLowerCase().includes(textoBuscado)) ||
                                      eq.ubicacion.toLowerCase().includes(textoBuscado);
                
                const coincideEdificio = filtroEdificio === "" || eq.ubicacion.toLowerCase().includes(filtroEdificio);

                return coincideTexto && coincideEdificio;
            });
            
            renderTabla(datosFiltrados);
        }

        function abrirModalEditar(id) {
            const eq = datosGlobales.find(e => e.inventario === id);
            if(!eq) return;
            document.getElementById('editIdOriginal').value = eq.inventario;
            document.getElementById('editPiezas').value = eq.piezas;
            document.getElementById('editDescripcion').value = eq.descripcion;
            document.getElementById('editUbicacion').value = eq.ubicacion;
            document.getElementById('modalEdicion').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modalEdicion').classList.add('hidden');
        }

        function guardarEdicion() {
            const payload = {
                accion: 'editarEquipo',
                inventario: document.getElementById('editIdOriginal').value,
                piezas: document.getElementById('editPiezas').value,
                descripcion: document.getElementById('editDescripcion').value.trim(),
                ubicacion: document.getElementById('editUbicacion').value.trim()
            };

            fetch(URL_API, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    cerrarModal();
                    cargarDatos(); 
                } else {
                    alert('Error: ' + res.message);
                }
            }).catch(err => alert('Error de conexión'));
        }

        function eliminarRegistro(id) {
            if(confirm(`¿Eliminar definitivamente el inventario ${id}? Esta acción no se puede deshacer.`)) {
                const payload = { accion: 'eliminarEquipo', inventario: id };

                fetch(URL_API, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                })
                .then(res => res.json())
                .then(res => {
                    if(res.success) {
                        cargarDatos(); 
                    } else {
                        alert('Error al eliminar: ' + res.message);
                    }
                }).catch(err => alert('Error de conexión'));
            }
        }
    </script>
</body>
</html>
